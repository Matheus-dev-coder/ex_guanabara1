<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px
        }
        div#cx1{
           flex-basis: 150px;
           flex-grow:0;
           flex-shrink:1;
        }
        div#cx2{
            flex-basis: 150px;
            flex-grow:2;
            flex-shrink:0;
        }
        div#cx3{
            flex-basis: 150px;
            flex-grow:1;
            flex-shrink:2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cx1">A</div>
        <div class="item" id="cx2">B</div>
        <div class="item" id="cx3">C</div>
</body>
</html>
